<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Duotone PDU</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: workbench — settings panel on the left, large canvas on the right, image strip below */
:root{
  --bg:#eeeef2; --panel:#ffffff; --fg:#1b1f33; --muted:#5d6380; --line:#d9dbe6;
  --accent:#495a99; --accent-fg:#ffffff; --canvas:#e2e3ea;
  --display:"Instrument Sans",system-ui,sans-serif; --body:"Instrument Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141d; --panel:#1a1d2a; --fg:#e8e9f1; --muted:#9aa0bd; --line:#2c3043;
  --accent:#8c9be0; --accent-fg:#12141d; --canvas:#0d0f16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141d; --panel:#1a1d2a; --fg:#e8e9f1; --muted:#9aa0bd; --line:#2c3043;
  --accent:#8c9be0; --accent-fg:#12141d; --canvas:#0d0f16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
h1 span{color:var(--muted);font-weight:500}
.sub{color:var(--muted);margin:0;max-width:62ch}
.main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:18px}
.group{display:grid;gap:10px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.ramp{height:28px;border-radius:6px;border:1px solid var(--line)}
.colors{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.cpick{display:grid;gap:4px;min-width:0}
.cpick small{color:var(--muted);font-size:12px}
.cfield{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--bg)}
.cfield input[type=color]{width:30px;height:28px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.cfield input[type=text]{width:100%;min-width:0;border:0;background:none;color:var(--fg);font-family:var(--mono);font-size:13px;text-transform:uppercase;outline:none}
.iconbtn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;height:38px;width:38px;cursor:pointer;font-size:16px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:6px;cursor:pointer;font:inherit;font-size:12px}
.preset i{width:26px;height:16px;border-radius:999px;display:block}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.preset .x{color:var(--muted);margin-left:2px}
.slider{display:grid;gap:4px}
.slider .row{display:flex;justify-content:space-between;font-size:13px}
.slider output{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 14px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:12px;font-weight:500}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);color:var(--fg);font:inherit;font-size:13px;padding:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.actions{display:grid;gap:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{display:grid;gap:12px;min-width:0}
.canvasbox{position:relative;background:var(--canvas);border-radius:10px;border:1px solid var(--line);min-height:360px;display:grid;place-items:center;padding:16px;overflow:hidden}
.canvasbox canvas{max-width:100%;max-height:72vh;display:block;box-shadow:0 2px 16px rgba(0,0,0,.18)}
.canvasbox.drag{outline:2px dashed var(--accent);outline-offset:-8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tag{position:absolute;top:12px;left:12px;background:var(--panel);color:var(--fg);border:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumb{flex:none;width:92px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px;cursor:pointer;position:relative;color:var(--fg);font:inherit}
.thumb img{width:100%;height:64px;object-fit:cover;border-radius:4px;display:block}
.thumb span{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;text-align:left}
.thumb[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thumb .rm{display:block;text-align:center;position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;cursor:pointer;padding:0}
.add{flex:none;width:92px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);cursor:pointer;min-height:90px;font-size:12px;text-align:center;background:none;font-family:inherit}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;background:none;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font:inherit;padding:48px 24px;width:100%;max-width:520px;cursor:pointer}
.empty:hover{border-color:var(--accent);color:var(--fg)}
.empty strong{font-family:var(--display);font-size:18px;font-weight:600;color:var(--fg)}
.empty span{font-size:13px}
.ramp-mini{width:120px;height:10px;border-radius:999px;margin-bottom:8px}
[hidden]{display:none!important}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
.hint{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Duotone <span>· Public Design Unit</span></h1>
    <p class="sub">Upload your photos, pick two colors and download.</p>
  </header>

  <div class="main">
    <aside class="panel" aria-label="Settings">
      <div class="group">
        <div class="label">Gradient map</div>
        <div class="ramp" id="ramp"></div>
        <div class="colors">
          <label class="cpick"><small>Shadows</small>
            <span class="cfield"><input type="color" id="c1" value="#495a99"><input type="text" id="c1t" value="#495A99" maxlength="7" aria-label="Shadows hex"></span>
          </label>
          <button class="iconbtn" id="swap" title="Swap colors" aria-label="Swap colors">⇄</button>
          <label class="cpick"><small>Highlights</small>
            <span class="cfield"><input type="color" id="c2" value="#f0ecdd"><input type="text" id="c2t" value="#F0ECDD" maxlength="7" aria-label="Highlights hex"></span>
          </label>
        </div>
      </div>

      <div class="group">
        <div class="label">Palettes <button class="linkbtn" id="savePreset">+ Save current</button></div>
        <div class="presets" id="presets"></div>
      </div>

      <div class="group">
        <div class="label">Treatment <button class="linkbtn" id="reset">Reset</button></div>
        <div class="slider"><div class="row"><label for="noise">Noise</label><output id="noiseO"></output></div><input type="range" id="noise" min="0" max="20" step="0.5" value="5"></div>
        <div class="slider"><div class="row"><label for="black">Black point</label><output id="blackO"></output></div><input type="range" id="black" min="0" max="120" step="1" value="18"></div>
        <div class="slider"><div class="row"><label for="white">White point</label><output id="whiteO"></output></div><input type="range" id="white" min="135" max="255" step="1" value="255"></div>
        <div class="slider"><div class="row"><label for="gamma">Gamma</label><output id="gammaO"></output></div><input type="range" id="gamma" min="0.5" max="2" step="0.01" value="1.04"></div>
      </div>

      <div class="group">
        <div class="label">Export</div>
        <div class="seg" role="group" aria-label="Format">
          <button id="fPng" aria-pressed="false">PNG</button>
          <button id="fJpg" aria-pressed="true">JPG</button>
        </div>
        <div class="actions">
          <button class="btn primary" id="dlOne">Download image</button>
          <button class="btn" id="dlAll">Download all (.zip)</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </div>
    </aside>

    <section class="stage">
      <div class="toolbar">
        <div class="meta" id="meta">—</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn small" id="compare" title="Press and hold to see the original">Hold: show original</button>
          <button class="btn small" id="pickDir">Upload folder</button>
          <button class="btn small" id="clearAll" hidden>Remove all</button>
          <button class="btn small" id="pick">Upload images</button>
        </div>
      </div>
      <div class="canvasbox" id="drop">
        <span class="tag" id="tag" hidden>Original</span>
        <button class="empty" id="empty" type="button">
          <span class="ramp-mini" id="emptyRamp"></span>
          <strong>Drop your images here</strong>
          <span>or click to choose them · JPG, PNG or WebP · upload a batch or a whole folder</span>
        </button>
        <canvas id="cv" aria-label="Processed preview" hidden></canvas>
      </div>
      <div class="strip" id="strip"></div>
      <p class="hint">Drag images onto the canvas or paste them (⌘V). They are processed at full resolution in your browser; nothing is uploaded to any server.</p>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <input type="file" id="dir" webkitdirectory multiple hidden>
    </section>
  </div>
</div>

<script>
const DEFAULTS={noise:5,black:18,white:255,gamma:1.04,c1:"#495A99",c2:"#F0ECDD"};
const BUILTIN=[
  {name:"Birmingham",c1:"#495A99",c2:"#F0ECDD"},
  {name:"Ink",c1:"#1E2233",c2:"#EDEBE4"},
  {name:"Dayton",c1:"#2F5A47",c2:"#EEF0E2"},
  {name:"Brick",c1:"#8A3B2E",c2:"#F5E9DC"},
  {name:"Plum",c1:"#5A3A6E",c2:"#F2E8EF"},
];
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d",{willReadFrequently:true});
let images=[]; // {name, file, w, h, thumb} — only the current image is kept decoded in memory
let cur=-1, fmt="jpg", showOrig=false, pending=false;
let userPresets=[];
try{userPresets=JSON.parse(localStorage.getItem("duotone.presets")||"[]")}catch(e){}

const hexOk=h=>/^#[0-9a-f]{6}$/i.test(h);
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function params(){return{noise:+$("noise").value,black:+$("black").value,white:+$("white").value,gamma:+$("gamma").value,c1:hexRgb($("c1").value),c2:hexRgb($("c2").value)}}

// ---- Processing (same order as the Photoshop action) ----
function makeNoise(n){
  // uniform monochromatic noise, fixed seed so preview and export match
  const a=new Int8Array(n); let s=0x9e3779b9;
  for(let i=0;i<n;i++){s^=s<<13;s^=s>>>17;s^=s<<5;a[i]=((s>>>0)%255)-127;}
  return a;
}
function processInto(src,noise,out,p){
  const d=src.data,o=out.data,n=d.length/4;
  const amp=p.noise/100*255/127;
  const lut=new Uint8ClampedArray(256*3); // level -> color lookup table
  const lev=new Float32Array(256);
  const range=Math.max(1,p.white-p.black), ig=1/p.gamma;
  for(let v=0;v<256;v++){let t=(v-p.black)/range;t=t<0?0:t>1?1:t;lev[v]=Math.pow(t,ig);}
  for(let v=0;v<256;v++){const t=v/255;for(let c=0;c<3;c++)lut[v*3+c]=p.c1[c]+(p.c2[c]-p.c1[c])*t;}
  for(let i=0,j=0;i<n;i++,j+=4){
    const k=noise[i]*amp;
    let r=d[j]+k,g=d[j+1]+k,b=d[j+2]+k;
    r=r<0?0:r>255?255:r|0; g=g<0?0:g>255?255:g|0; b=b<0?0:b>255?255:b|0;
    let L=(0.299*lev[r]+0.587*lev[g]+0.114*lev[b])*255+.5|0;
    const q=L*3; o[j]=lut[q];o[j+1]=lut[q+1];o[j+2]=lut[q+2];o[j+3]=d[j+3];
  }
}
let noiseBuf=new Int8Array(0);
function getNoise(n){if(noiseBuf.length<n)noiseBuf=makeNoise(n);return noiseBuf;}
let cache={it:null,src:null};
async function decode(it){
  if(cache.it===it)return cache;
  cache={it:null,src:null};
  const bmp=await createImageBitmap(it.file);
  const c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;
  const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(bmp,0,0);if(bmp.close)bmp.close();
  cache={it,src:x.getImageData(0,0,c.width,c.height)};
  return cache;
}
let outBuf=null,renderToken=0;
async function render(){
  pending=false;
  const it=images[cur]; if(!it)return;
  const tok=++renderToken;
  let d;try{d=await decode(it);}catch(e){setStatus("Couldn’t open this image.");return;}
  if(tok!==renderToken||images[cur]!==it)return;
  const w=d.src.width,h=d.src.height;
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  if(showOrig){ctx.putImageData(d.src,0,0);return;}
  if(!outBuf||outBuf.width!==w||outBuf.height!==h)outBuf=ctx.createImageData(w,h);
  processInto(d.src,getNoise(w*h),outBuf,params());
  ctx.putImageData(outBuf,0,0);
}
function schedule(){if(!pending){pending=true;requestAnimationFrame(render);}}

// ---- Image loading ----
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function addImage(file,name){
  const bmp=await createImageBitmap(file);
  const w=bmp.width,h=bmp.height;
  const t=document.createElement("canvas"),s=Math.min(1,180/Math.max(w,h));t.width=Math.max(1,Math.round(w*s));t.height=Math.max(1,Math.round(h*s));
  t.getContext("2d").drawImage(bmp,0,0,t.width,t.height);if(bmp.close)bmp.close();
  images.push({name,file,w,h,thumb:t.toDataURL("image/jpeg",.7)});
}
let loading=false;
async function addFiles(files){
  const list=[...files].filter(f=>f.type.startsWith("image/")||/\.(jpe?g|png|webp|gif|bmp|avif|heic)$/i.test(f.name));
  if(!list.length||loading)return;
  loading=true;const first=images.length;let k=0,failed=0;
  for(const f of list){
    k++;setStatus(`Loading ${k} of ${list.length}…`);
    try{await addImage(f,f.name.replace(/\.[^.]+$/,""));}catch(e){failed++;setStatus(`Couldn’t open “${f.name}”. Try a JPG or PNG.`);}
    if(k===1||k%10===0||k===list.length){if(cur<first)cur=Math.min(first,images.length-1);refreshStrip();schedule();}
  }
  loading=false;
  if(!failed)setStatus(list.length>1?`${list.length} images loaded.`:"");
}
function refreshStrip(){
  const s=$("strip");s.innerHTML="";
  images.forEach((it,i)=>{
    const b=document.createElement("button");b.className="thumb";b.setAttribute("aria-current",i===cur);
    b.innerHTML=`<img alt=""><span></span>${'<span class="rm" role="button" aria-label="Remove">×</span>'}`;
    b.querySelector("img").src=it.thumb;b.querySelector("span").textContent=it.name;
    b.onclick=e=>{if(e.target.classList.contains("rm")){if(cache.it===it)cache={it:null,src:null};images.splice(i,1);if(cur>=images.length)cur=images.length-1;refreshStrip();if(images.length)schedule(); return;}cur=i;refreshStrip();schedule();};
    s.appendChild(b);
  });
  const a=document.createElement("button");a.className="add";a.textContent="+ Add";a.onclick=()=>$("file").click();s.appendChild(a);
  const it=images[cur];
  $("meta").textContent=it?`${images.length>1?(cur+1)+" / "+images.length+" · ":""}${it.name} · ${it.w}×${it.h}px`:"No images";
  $("empty").hidden=!!it;cv.hidden=!it;s.hidden=!images.length;$("compare").disabled=!it;$("clearAll").hidden=!images.length;
  $("dlOne").disabled=!it;$("dlAll").disabled=images.length<2;
}

// ---- Controls ----
function syncUI(){
  $("noiseO").textContent=$("noise").value+" %";
  $("blackO").textContent=$("black").value;
  $("whiteO").textContent=$("white").value;
  $("gammaO").textContent=(+$("gamma").value).toFixed(2);
  $("ramp").style.background=$("emptyRamp").style.background=`linear-gradient(90deg,${$("c1").value},${$("c2").value})`;
  $("c1t").value=$("c1").value.toUpperCase();$("c2t").value=$("c2").value.toUpperCase();
  drawPresets();
}
function setColors(a,b){$("c1").value=a.toLowerCase();$("c2").value=b.toLowerCase();syncUI();schedule();}
["noise","black","white","gamma"].forEach(id=>$(id).addEventListener("input",()=>{
  if(+$("black").value>=+$("white").value-10){ if(id==="black")$("black").value=+$("white").value-11; else $("white").value=+$("black").value+11; }
  syncUI();schedule();}));
["c1","c2"].forEach(id=>$(id).addEventListener("input",()=>{syncUI();schedule();}));
["c1","c2"].forEach(id=>$(id+"t").addEventListener("input",e=>{let v=e.target.value.trim();if(v[0]!=="#")v="#"+v;if(hexOk(v)){$(id).value=v.toLowerCase();$("ramp").style.background=`linear-gradient(90deg,${$("c1").value},${$("c2").value})`;drawPresets();schedule();}}));
["c1","c2"].forEach(id=>$(id+"t").addEventListener("blur",()=>syncUI()));
$("swap").onclick=()=>setColors($("c2").value,$("c1").value);
$("reset").onclick=()=>{$("noise").value=DEFAULTS.noise;$("black").value=DEFAULTS.black;$("white").value=DEFAULTS.white;$("gamma").value=DEFAULTS.gamma;syncUI();schedule();};

function drawPresets(){
  const box=$("presets");box.innerHTML="";
  const a=$("c1").value.toUpperCase(),b=$("c2").value.toUpperCase();
  [...BUILTIN.map(p=>({...p,builtin:true})),...userPresets].forEach((p,i)=>{
    const el=document.createElement("button");el.className="preset";
    el.setAttribute("aria-pressed",p.c1.toUpperCase()===a&&p.c2.toUpperCase()===b);
    el.innerHTML=`<i></i><span></span>${p.builtin?"":'<span class="x" title="Delete">×</span>'}`;
    el.querySelector("i").style.background=`linear-gradient(90deg,${p.c1},${p.c2})`;
    el.querySelector("span").textContent=p.name;
    el.onclick=e=>{
      if(e.target.classList.contains("x")){userPresets.splice(i-BUILTIN.length,1);persist();drawPresets();return;}
      setColors(p.c1,p.c2);
    };
    box.appendChild(el);
  });
}
function persist(){try{localStorage.setItem("duotone.presets",JSON.stringify(userPresets))}catch(e){}}
$("savePreset").onclick=()=>{
  const c1=$("c1").value.toUpperCase(),c2=$("c2").value.toUpperCase();
  if([...BUILTIN,...userPresets].some(p=>p.c1.toUpperCase()===c1&&p.c2.toUpperCase()===c2)){setStatus("That palette is already saved.");return;}
  userPresets.push({name:`Mine ${userPresets.length+1}`,c1,c2});persist();drawPresets();setStatus("Palette saved in this browser.");
};

$("fPng").onclick=()=>{fmt="png";$("fPng").setAttribute("aria-pressed",true);$("fJpg").setAttribute("aria-pressed",false);};
$("fJpg").onclick=()=>{fmt="jpg";$("fJpg").setAttribute("aria-pressed",true);$("fPng").setAttribute("aria-pressed",false);};

const cmp=$("compare");
const on=e=>{e.preventDefault();if(!images[cur])return;showOrig=true;$("tag").hidden=false;schedule();};
const off=()=>{if(!showOrig)return;showOrig=false;$("tag").hidden=true;schedule();};
cmp.addEventListener("pointerdown",on);["pointerup","pointerleave","pointercancel"].forEach(t=>cmp.addEventListener(t,off));
cmp.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter")on(e)});cmp.addEventListener("keyup",off);

$("pick").onclick=()=>$("file").click();
$("empty").onclick=()=>$("file").click();
$("pickDir").onclick=()=>$("dir").click();
$("dir").onchange=e=>{addFiles(e.target.files);e.target.value="";};
$("clearAll").onclick=()=>{if(loading)return;images=[];cur=-1;cache={it:null,src:null};outBuf=null;setStatus("");refreshStrip();};
$("file").onchange=e=>{addFiles(e.target.files);e.target.value="";};
const drop=$("drop");
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("drag");}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("drag");}));
drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));
document.addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])];if(f.length)addFiles(f);});

// ---- Export ----
function setStatus(t){$("status").textContent=t;}
async function exportBlob(it){
  const d=await decode(it),w=d.src.width,h=d.src.height;
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");const o=x.createImageData(w,h);
  processInto(d.src,getNoise(w*h),o,params());x.putImageData(o,0,0);
  return new Promise(res=>c.toBlob(res,fmt==="png"?"image/png":"image/jpeg",0.95));
}
const fname=it=>`${it.name}_duotone.${fmt}`;
let downloads=null;
(async()=>{try{downloads=await window.claude?.use?.("downloads");}catch(e){}})();
async function offer(filename,blob){
  if(downloads){
    try{await downloads.save({filename,data:blob});setStatus(`Saved: ${filename}`);}
    catch(e){setStatus(e.code==="declined"?"Download canceled.":e.code==="rate_limited"?"A download is already pending; try again in a moment.":"Downloads aren’t available in this view.");}
  }else{
    // outside the Claude viewer (local file): regular download
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);setStatus(`Downloaded: ${filename}`);
  }
}
$("dlOne").onclick=async()=>{const it=images[cur];if(!it)return;setStatus("Processing at full resolution…");const b=await exportBlob(it);await offer(fname(it),b);};
$("dlAll").onclick=async()=>{
  if(!window.JSZip){setStatus("The ZIP library didn’t load. Download the images one at a time.");return;}
  if(loading)return;
  const zip=new JSZip();
  const used=new Set();
  for(let i=0;i<images.length;i++){setStatus(`Processing ${i+1} of ${images.length}…`);let n=fname(images[i]),j=2;while(used.has(n)){n=fname(images[i]).replace(/(\.\w+)$/,`_${j++}$1`);}used.add(n);zip.file(n,await exportBlob(images[i]),{compression:"STORE"});}
  setStatus("Compressing…");
  const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
  await offer(`duotone_${images.length}_images.zip`,blob);
};

// ---- Start ----
syncUI();
refreshStrip();
</script>
